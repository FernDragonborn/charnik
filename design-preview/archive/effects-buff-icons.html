<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Buff icon — options</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap');
			:root {
				--bg: #0f1116;
				--surface: #171a21;
				--border: #272c37;
				--border-strong: #333a47;
				--text: #e6e8ec;
				--muted: #878f9d;
				--good: #3bb8a6;
				--accent-bright: #ef6b78;
				--resource: #caa24a;
				--font-d: 'Space Grotesk', sans-serif;
				--font-m: 'JetBrains Mono', monospace;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--font-d);
				margin: 0;
				padding: 32px;
			}
			h1 {
				font-size: 18px;
				font-weight: 700;
				margin: 0 0 4px;
			}
			.lead {
				color: var(--muted);
				font-size: 13px;
				margin: 0 0 26px;
			}
			.opts {
				display: flex;
				flex-wrap: wrap;
				gap: 14px;
				max-width: 720px;
			}
			.opt {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 7px;
				width: 96px;
			}
			.chip {
				width: 46px;
				height: 46px;
				display: grid;
				place-items: center;
				border: 1px solid var(--border-strong);
				border-radius: 10px;
				background: var(--surface);
				color: var(--good);
			}
			.lbl {
				font-family: var(--font-m);
				font-size: 10px;
				color: var(--muted);
				text-align: center;
			}
			/* in-context header preview (buff header + a debuff for contrast) */
			.ctx {
				margin-top: 30px;
				display: flex;
				gap: 20px;
				flex-wrap: wrap;
			}
			.hdr {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				font-family: var(--font-m);
				font-size: 10px;
				letter-spacing: 0.13em;
				text-transform: uppercase;
				color: var(--good);
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 6px 12px;
			}
			.hdr .ct {
				color: var(--muted);
			}
			.hdr.deb {
				color: var(--accent-bright);
			}
		</style>
	</head>
	<body>
		<h1>Buffs icon — 6 options (✦ reserved for reaction)</h1>
		<p class="lead">Teal buff-header colour. Pick a number.</p>
		<div class="opts">
			<!-- 1: plus-circle -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7.2" /><path d="M10 6.4 V13.6 M6.4 10 H13.6" /></svg></span>
				<span class="lbl">1 · plus-circle</span>
			</div>
			<!-- 2: up chevron -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L10 6.5 L16 12.5" /></svg></span>
				<span class="lbl">2 · up-chevron</span>
			</div>
			<!-- 3: shield with check (intact — pairs with cracked-shield debuff) -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 2.5 L16 5 V10 C16 14 13 16.6 10 18 C7 16.6 4 14 4 10 V5 Z" /><path d="M7.3 9.7 L9.2 11.6 L12.9 7.4" stroke-linecap="round" /></svg></span>
				<span class="lbl">3 · shield ✓</span>
			</div>
			<!-- 4: up arrow -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16 V4.5 M5.5 9 L10 4.5 L14.5 9" /></svg></span>
				<span class="lbl">4 · up-arrow</span>
			</div>
			<!-- 5: sun / radiance -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.4" /><path d="M10 2.2 V4 M10 16 V17.8 M2.2 10 H4 M16 10 H17.8 M4.5 4.5 L5.8 5.8 M14.2 14.2 L15.5 15.5 M15.5 4.5 L14.2 5.8 M5.8 14.2 L4.5 15.5" /></svg></span>
				<span class="lbl">5 · sun</span>
			</div>
			<!-- 6: double up-chevron (elevated) -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 L10 4 L16 9.5 M4 15 L10 9.5 L16 15" /></svg></span>
				<span class="lbl">6 · double-up</span>
			</div>
		</div>

		<div class="ctx">
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7.2" /><path d="M10 6.4 V13.6 M6.4 10 H13.6" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 2.5 L16 5 V10 C16 14 13 16.6 10 18 C7 16.6 4 14 4 10 V5 Z" /><path d="M7.3 9.7 L9.2 11.6 L12.9 7.4" stroke-linecap="round" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16 V4.5 M5.5 9 L10 4.5 L14.5 9" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr deb"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2.5 L16 5 V10 C16 14 13 16.6 10 18 C7 16.6 4 14 4 10 V5 Z" /><path d="M10.5 4.5 L8.5 9 L11 10.5 L9.2 15.5" stroke-linecap="round" /></svg>Debuffs <span class="ct">· 3</span></span>
		</div>
	</body>
</html>
