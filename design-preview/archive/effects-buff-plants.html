<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Buff icon — plant theme</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap');
			:root {
				--bg: #0f1116;
				--surface: #171a21;
				--border: #272c37;
				--border-strong: #333a47;
				--text: #e6e8ec;
				--muted: #878f9d;
				--good: #3bb8a6;
				--accent-bright: #ef6b78;
				--font-d: 'Space Grotesk', sans-serif;
				--font-m: 'JetBrains Mono', monospace;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--font-d);
				margin: 0;
				padding: 32px;
			}
			h1 {
				font-size: 18px;
				font-weight: 700;
				margin: 0 0 4px;
			}
			.lead {
				color: var(--muted);
				font-size: 13px;
				margin: 0 0 26px;
			}
			.opts {
				display: flex;
				flex-wrap: wrap;
				gap: 16px;
				max-width: 820px;
			}
			.opt {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				width: 108px;
			}
			.chip {
				width: 52px;
				height: 52px;
				display: grid;
				place-items: center;
				border: 1px solid var(--border-strong);
				border-radius: 11px;
				background: var(--surface);
				color: var(--good);
			}
			.lbl {
				font-family: var(--font-m);
				font-size: 10px;
				color: var(--muted);
				text-align: center;
			}
			.ctx {
				margin-top: 30px;
				display: flex;
				gap: 18px;
				flex-wrap: wrap;
			}
			.hdr {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				font-family: var(--font-m);
				font-size: 10px;
				letter-spacing: 0.13em;
				text-transform: uppercase;
				color: var(--good);
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 6px 12px;
			}
			.hdr .ct {
				color: var(--muted);
			}
			.hdr.deb {
				color: var(--accent-bright);
			}
		</style>
	</head>
	<body>
		<h1>Buffs icon — plant / growth theme (6)</h1>
		<p class="lead">Botanical motifs. Debuff cracked shield shown for contrast.</p>
		<div class="opts">
			<!-- 1: seedling / sprout -->
			<div class="opt">
				<span class="chip"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17.5 V8.5" /><path d="M10 10 C10 6.8 12.4 4.6 15.8 4.6 C15.8 7.8 13.4 10 10 10 Z" /><path d="M10 11.5 C10 9 7.9 7.3 5 7.3 C5 9.8 7.1 11.5 10 11.5 Z" /></svg></span>
				<span class="lbl">1 · seedling</span>
			</div>
			<!-- 2: single leaf -->
			<div class="opt">
				<span class="chip"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 C4 8.8 8.8 4 16 4 C16 11.2 11.2 16 4 16 Z" /><path d="M6.5 13.5 L13.5 6.5 M8 12 L11 11.5 M9 10 L12 9.5" /></svg></span>
				<span class="lbl">2 · leaf</span>
			</div>
			<!-- 3: clover / trefoil -->
			<div class="opt">
				<span class="chip"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="10" cy="6.4" r="2.8" /><circle cx="6.5" cy="11.4" r="2.8" /><circle cx="13.5" cy="11.4" r="2.8" /><path d="M10 12 V16.5" stroke-linecap="round" /></svg></span>
				<span class="lbl">3 · clover</span>
			</div>
			<!-- 4: flower (5-petal) -->
			<div class="opt">
				<span class="chip"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><circle cx="10" cy="5.3" r="2.5" /><circle cx="14.5" cy="8.6" r="2.5" /><circle cx="12.8" cy="13.9" r="2.5" /><circle cx="7.2" cy="13.9" r="2.5" /><circle cx="5.5" cy="8.6" r="2.5" /><circle cx="10" cy="10" r="1.9" fill="currentColor" stroke="none" /></svg></span>
				<span class="lbl">4 · flower</span>
			</div>
			<!-- 5: leafy sprig -->
			<div class="opt">
				<span class="chip"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17 C7.5 12 10 7.5 15 4.5" /><path d="M9.5 11 C10.8 9.6 12.6 9 14.5 9" /><path d="M8 13.7 C9.2 12.4 11 11.8 12.8 11.9" /><path d="M11.7 8.4 C12.7 7 14.3 6.2 16 6" /></svg></span>
				<span class="lbl">5 · sprig</span>
			</div>
			<!-- 6: small tree -->
			<div class="opt">
				<span class="chip"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17.5 V11" /><path d="M10 11 C6 11 4 8.5 5.5 6 C6 4.8 7 4.2 8 4.4 C8.4 3 9.1 2.4 10 2.4 C10.9 2.4 11.6 3 12 4.4 C13 4.2 14 4.8 14.5 6 C16 8.5 14 11 10 11 Z" /></svg></span>
				<span class="lbl">6 · tree</span>
			</div>
		</div>

		<div class="ctx">
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17.5 V8.5" /><path d="M10 10 C10 6.8 12.4 4.6 15.8 4.6 C15.8 7.8 13.4 10 10 10 Z" /><path d="M10 11.5 C10 9 7.9 7.3 5 7.3 C5 9.8 7.1 11.5 10 11.5 Z" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 C4 8.8 8.8 4 16 4 C16 11.2 11.2 16 4 16 Z" /><path d="M6.5 13.5 L13.5 6.5" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="10" cy="6.4" r="2.8" /><circle cx="6.5" cy="11.4" r="2.8" /><circle cx="13.5" cy="11.4" r="2.8" /><path d="M10 12 V16.5" stroke-linecap="round" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr deb"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2.5 L16 5 V10 C16 14 13 16.6 10 18 C7 16.6 4 14 4 10 V5 Z" /><path d="M10.5 4.5 L8.5 9 L11 10.5 L9.2 15.5" stroke-linecap="round" /></svg>Debuffs <span class="ct">· 3</span></span>
		</div>
	</body>
</html>
