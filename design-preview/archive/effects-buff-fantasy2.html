<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Buff icon — fantasy 2</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap');
			:root {
				--bg: #0f1116;
				--surface: #171a21;
				--border: #272c37;
				--border-strong: #333a47;
				--text: #e6e8ec;
				--muted: #878f9d;
				--good: #3bb8a6;
				--accent-bright: #ef6b78;
				--font-d: 'Space Grotesk', sans-serif;
				--font-m: 'JetBrains Mono', monospace;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--font-d);
				margin: 0;
				padding: 32px;
			}
			h1 {
				font-size: 18px;
				font-weight: 700;
				margin: 0 0 4px;
			}
			.lead {
				color: var(--muted);
				font-size: 13px;
				margin: 0 0 26px;
			}
			.opts {
				display: flex;
				flex-wrap: wrap;
				gap: 16px;
				max-width: 820px;
			}
			.opt {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				width: 108px;
			}
			.chip {
				width: 52px;
				height: 52px;
				display: grid;
				place-items: center;
				border: 1px solid var(--border-strong);
				border-radius: 11px;
				background: var(--surface);
				color: var(--good);
			}
			.lbl {
				font-family: var(--font-m);
				font-size: 10px;
				color: var(--muted);
				text-align: center;
			}
			.ctx {
				margin-top: 30px;
				display: flex;
				gap: 18px;
				flex-wrap: wrap;
			}
			.hdr {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				font-family: var(--font-m);
				font-size: 10px;
				letter-spacing: 0.13em;
				text-transform: uppercase;
				color: var(--good);
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 6px 12px;
			}
			.hdr .ct {
				color: var(--muted);
			}
			.hdr.deb {
				color: var(--accent-bright);
			}
		</style>
	</head>
	<body>
		<h1>Buffs icon — fantasy batch 2 (6)</h1>
		<p class="lead">Fresh motifs. Debuff cracked shield shown for contrast.</p>
		<div class="opts">
			<!-- 1: sun sigil -->
			<div class="opt">
				<span class="chip"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.3" fill="currentColor" stroke="none" /><path d="M10 1.6 V4 M10 16 V18.4 M1.6 10 H4 M16 10 H18.4 M4 4 L5.7 5.7 M14.3 14.3 L16 16 M16 4 L14.3 5.7 M5.7 14.3 L4 16" /></svg></span>
				<span class="lbl">1 · sun</span>
			</div>
			<!-- 2: wings + gem -->
			<div class="opt">
				<span class="chip"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8 C6.5 5.8 3.8 5.6 2 7 C4.2 7.6 6.2 8.8 8 10.6" /><path d="M11 8 C13.5 5.8 16.2 5.6 18 7 C15.8 7.6 13.8 8.8 12 10.6" /><path d="M10 7 L11.4 10 L10 13 L8.6 10 Z" /></svg></span>
				<span class="lbl">2 · wings + gem</span>
			</div>
			<!-- 3: amulet / talisman -->
			<div class="opt">
				<span class="chip"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="10" cy="4.4" r="1.9" /><path d="M10 6.3 L14 11 L10 16.5 L6 11 Z" /><path d="M7.6 10.5 H12.4" /></svg></span>
				<span class="lbl">3 · amulet</span>
			</div>
			<!-- 4: tiwaz rune (victory ↑) -->
			<div class="opt">
				<span class="chip"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 V17 M10 3 L6 7.2 M10 3 L14 7.2" /></svg></span>
				<span class="lbl">4 · tiwaz rune</span>
			</div>
			<!-- 5: alchemy triangle (ascend) -->
			<div class="opt">
				<span class="chip"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 3 L16.5 15.5 H3.5 Z" /><path d="M6.5 11.5 H13.5" stroke-linecap="round" /></svg></span>
				<span class="lbl">5 · alchemy ▲</span>
			</div>
			<!-- 6: crescent + star (celestial) -->
			<div class="opt">
				<span class="chip"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12.5 3.5 A6.2 6.2 0 1 0 12.5 16.5 A4.9 4.9 0 1 1 12.5 3.5 Z" /><path d="M15.5 10 L16.2 11.7 L18 12 L16.5 13.2 L16.9 15 L15.5 14 L14.1 15 L14.5 13.2 L13 12 L14.8 11.7 Z" /></svg></span>
				<span class="lbl">6 · crescent+star</span>
			</div>
		</div>

		<div class="ctx">
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.3" fill="currentColor" stroke="none" /><path d="M10 1.6 V4 M10 16 V18.4 M1.6 10 H4 M16 10 H18.4 M4 4 L5.7 5.7 M14.3 14.3 L16 16 M16 4 L14.3 5.7 M5.7 14.3 L4 16" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8 C6.5 5.8 3.8 5.6 2 7 C4.2 7.6 6.2 8.8 8 10.6" /><path d="M11 8 C13.5 5.8 16.2 5.6 18 7 C15.8 7.6 13.8 8.8 12 10.6" /><path d="M10 7 L11.4 10 L10 13 L8.6 10 Z" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 V17 M10 3 L6 7.2 M10 3 L14 7.2" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12.5 3.5 A6.2 6.2 0 1 0 12.5 16.5 A4.9 4.9 0 1 1 12.5 3.5 Z" /><path d="M15.5 10 L16.2 11.7 L18 12 L16.5 13.2 L16.9 15 L15.5 14 L14.1 15 L14.5 13.2 L13 12 L14.8 11.7 Z" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr deb"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2.5 L16 5 V10 C16 14 13 16.6 10 18 C7 16.6 4 14 4 10 V5 Z" /><path d="M10.5 4.5 L8.5 9 L11 10.5 L9.2 15.5" stroke-linecap="round" /></svg>Debuffs <span class="ct">· 3</span></span>
		</div>
	</body>
</html>
