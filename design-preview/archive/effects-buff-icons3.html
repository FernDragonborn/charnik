<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Buff icon — round forms</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap');
			:root {
				--bg: #0f1116;
				--surface: #171a21;
				--border: #272c37;
				--border-strong: #333a47;
				--text: #e6e8ec;
				--muted: #878f9d;
				--good: #3bb8a6;
				--accent-bright: #ef6b78;
				--font-d: 'Space Grotesk', sans-serif;
				--font-m: 'JetBrains Mono', monospace;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--font-d);
				margin: 0;
				padding: 32px;
			}
			h1 {
				font-size: 18px;
				font-weight: 700;
				margin: 0 0 4px;
			}
			.lead {
				color: var(--muted);
				font-size: 13px;
				margin: 0 0 26px;
			}
			.opts {
				display: flex;
				flex-wrap: wrap;
				gap: 14px;
				max-width: 780px;
			}
			.opt {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 7px;
				width: 100px;
			}
			.chip {
				width: 46px;
				height: 46px;
				display: grid;
				place-items: center;
				border: 1px solid var(--border-strong);
				border-radius: 10px;
				background: var(--surface);
				color: var(--good);
			}
			.lbl {
				font-family: var(--font-m);
				font-size: 10px;
				color: var(--muted);
				text-align: center;
			}
			.ctx {
				margin-top: 30px;
				display: flex;
				gap: 20px;
				flex-wrap: wrap;
			}
			.hdr {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				font-family: var(--font-m);
				font-size: 10px;
				letter-spacing: 0.13em;
				text-transform: uppercase;
				color: var(--good);
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 6px 12px;
			}
			.hdr .ct {
				color: var(--muted);
			}
			.hdr.deb {
				color: var(--accent-bright);
			}
		</style>
	</head>
	<body>
		<h1>Buffs icon — round forms (6)</h1>
		<p class="lead">± round shapes. Debuff = cracked shield shown for contrast.</p>
		<div class="opts">
			<!-- 1: heart -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 16.6 C10 16.6 3.4 12.3 3.4 7.7 A3.5 3.5 0 0 1 10 6.2 A3.5 3.5 0 0 1 16.6 7.7 C16.6 12.3 10 16.6 10 16.6 Z" /></svg></span>
				<span class="lbl">1 · heart</span>
			</div>
			<!-- 2: sun-disc -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" stroke="none"><circle cx="10" cy="10" r="4" /><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 2.6 V4.2 M10 15.8 V17.4 M2.6 10 H4.2 M15.8 10 H17.4 M4.8 4.8 L5.9 5.9 M14.1 14.1 L15.2 15.2 M15.2 4.8 L14.1 5.9 M5.9 14.1 L4.8 15.2" /></g></svg></span>
				<span class="lbl">2 · sun-disc</span>
			</div>
			<!-- 3: aura pulse -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="2.2" fill="currentColor" stroke="none" /><path d="M5 10 A5 5 0 0 1 15 10" /><path d="M2.8 10 A7.2 7.2 0 0 1 17.2 10" opacity="0.6" /></svg></span>
				<span class="lbl">3 · aura pulse</span>
			</div>
			<!-- 4: clover / trefoil -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="10" cy="6.4" r="2.7" /><circle cx="6.6" cy="11.2" r="2.7" /><circle cx="13.4" cy="11.2" r="2.7" /><path d="M10 11.5 V16.5" stroke-linecap="round" /></svg></span>
				<span class="lbl">4 · clover</span>
			</div>
			<!-- 5: orb (sphere w/ highlight) -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6.5" /><path d="M7 8 A3.6 3.6 0 0 1 11 6.4" stroke-linecap="round" opacity="0.7" /></svg></span>
				<span class="lbl">5 · orb</span>
			</div>
			<!-- 6: blossom (6-petal) -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" stroke="none"><circle cx="10" cy="10" r="2" /><circle cx="15" cy="10" r="1.7" /><circle cx="12.5" cy="5.67" r="1.7" /><circle cx="7.5" cy="5.67" r="1.7" /><circle cx="5" cy="10" r="1.7" /><circle cx="7.5" cy="14.33" r="1.7" /><circle cx="12.5" cy="14.33" r="1.7" /></svg></span>
				<span class="lbl">6 · blossom</span>
			</div>
		</div>

		<div class="ctx">
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 16.6 C10 16.6 3.4 12.3 3.4 7.7 A3.5 3.5 0 0 1 10 6.2 A3.5 3.5 0 0 1 16.6 7.7 C16.6 12.3 10 16.6 10 16.6 Z" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="2.2" fill="currentColor" stroke="none" /><path d="M5 10 A5 5 0 0 1 15 10" /><path d="M2.8 10 A7.2 7.2 0 0 1 17.2 10" opacity="0.6" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="10" cy="6.4" r="2.7" /><circle cx="6.6" cy="11.2" r="2.7" /><circle cx="13.4" cy="11.2" r="2.7" /><path d="M10 11.5 V16.5" stroke-linecap="round" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr deb"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2.5 L16 5 V10 C16 14 13 16.6 10 18 C7 16.6 4 14 4 10 V5 Z" /><path d="M10.5 4.5 L8.5 9 L11 10.5 L9.2 15.5" stroke-linecap="round" /></svg>Debuffs <span class="ct">· 3</span></span>
		</div>
	</body>
</html>
