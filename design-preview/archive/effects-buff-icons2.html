<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Buff icon — thematic direction</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap');
			:root {
				--bg: #0f1116;
				--surface: #171a21;
				--border: #272c37;
				--border-strong: #333a47;
				--text: #e6e8ec;
				--muted: #878f9d;
				--good: #3bb8a6;
				--accent-bright: #ef6b78;
				--font-d: 'Space Grotesk', sans-serif;
				--font-m: 'JetBrains Mono', monospace;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--font-d);
				margin: 0;
				padding: 32px;
			}
			h1 {
				font-size: 18px;
				font-weight: 700;
				margin: 0 0 4px;
			}
			.lead {
				color: var(--muted);
				font-size: 13px;
				margin: 0 0 26px;
			}
			.opts {
				display: flex;
				flex-wrap: wrap;
				gap: 14px;
				max-width: 760px;
			}
			.opt {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 7px;
				width: 100px;
			}
			.chip {
				width: 46px;
				height: 46px;
				display: grid;
				place-items: center;
				border: 1px solid var(--border-strong);
				border-radius: 10px;
				background: var(--surface);
				color: var(--good);
			}
			.lbl {
				font-family: var(--font-m);
				font-size: 10px;
				color: var(--muted);
				text-align: center;
			}
			.ctx {
				margin-top: 30px;
				display: flex;
				gap: 20px;
				flex-wrap: wrap;
			}
			.hdr {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				font-family: var(--font-m);
				font-size: 10px;
				letter-spacing: 0.13em;
				text-transform: uppercase;
				color: var(--good);
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 6px 12px;
			}
			.hdr .ct {
				color: var(--muted);
			}
			.hdr.deb {
				color: var(--accent-bright);
			}
		</style>
	</head>
	<body>
		<h1>Buffs icon — thematic direction (6)</h1>
		<p class="lead">RPG objects/motifs instead of arrows/plus. Debuff = cracked shield shown for contrast.</p>
		<div class="opts">
			<!-- 1: potion flask -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.3 3 H11.7 M9 3.4 V7.4 L5.8 13.6 A3.2 3.2 0 0 0 8.7 18 H11.3 A3.2 3.2 0 0 0 14.2 13.6 L11 7.4 V3.4" /><path d="M6.6 12.6 H13.4" /></svg></span>
				<span class="lbl">1 · potion</span>
			</div>
			<!-- 2: flame -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 2.5 C11 6 14 7 14 11 A4 4 0 0 1 6 11 C6 8.5 7.5 8 8 6 C8.5 8 9.5 6.5 10 2.5 Z" /></svg></span>
				<span class="lbl">2 · flame</span>
			</div>
			<!-- 3: star (5-point) -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10 2 L12.2 7.4 L18 7.9 L13.6 11.6 L15 17.3 L10 14.1 L5 17.3 L6.4 11.6 L2 7.9 L7.8 7.4 Z" /></svg></span>
				<span class="lbl">3 · star</span>
			</div>
			<!-- 4: heart -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 16.8 C10 16.8 3.2 12.4 3.2 7.6 A3.6 3.6 0 0 1 10 6 A3.6 3.6 0 0 1 16.8 7.6 C16.8 12.4 10 16.8 10 16.8 Z" /></svg></span>
				<span class="lbl">4 · heart</span>
			</div>
			<!-- 5: orb of power -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="11" r="5.3" /><path d="M7.7 9.3 A3 3 0 0 1 10.6 7.6" stroke-linecap="round" opacity="0.7" /><path d="M10 3 V1.6 M4.6 5 L3.6 4 M15.4 5 L16.4 4" stroke-linecap="round" opacity="0.7" /></svg></span>
				<span class="lbl">5 · orb</span>
			</div>
			<!-- 6: crown -->
			<div class="opt">
				<span class="chip"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 6.5 L6.5 12 L10 5.5 L13.5 12 L16.5 6.5 L15 15 H5 Z" /></svg></span>
				<span class="lbl">6 · crown</span>
			</div>
		</div>

		<div class="ctx">
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 2.5 C11 6 14 7 14 11 A4 4 0 0 1 6 11 C6 8.5 7.5 8 8 6 C8.5 8 9.5 6.5 10 2.5 Z" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10 2 L12.2 7.4 L18 7.9 L13.6 11.6 L15 17.3 L10 14.1 L5 17.3 L6.4 11.6 L2 7.9 L7.8 7.4 Z" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 6.5 L6.5 12 L10 5.5 L13.5 12 L16.5 6.5 L15 15 H5 Z" /></svg>Buffs <span class="ct">· 4</span></span>
			<span class="hdr deb"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2.5 L16 5 V10 C16 14 13 16.6 10 18 C7 16.6 4 14 4 10 V5 Z" /><path d="M10.5 4.5 L8.5 9 L11 10.5 L9.2 15.5" stroke-linecap="round" /></svg>Debuffs <span class="ct">· 3</span></span>
		</div>
	</body>
</html>
