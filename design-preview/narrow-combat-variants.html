<title>Narrow combat — basic variants</title>

<style id="tokens">
/*
 * Design-token contract (pinned at P1; default values decided P1, see docs/PLAN.md #18).
 *
 * Components MUST style only via these CSS custom properties — never hardcode a color,
 * radius, or spacing literal. Themes are switched by setting `data-theme` on <html>; a
 * custom theme just overrides the same token NAMES. Token names are SEMANTIC (surface/
 * text/accent/resource), not palette names, so a theme can remap meaning freely.
 *
 * Shipped default = DARK slate + heraldic-crimson accent + gold for resources. `:root`
 * carries the scales plus the dark palette as the baseline; `[data-theme='light']`
 * overrides the colors for the light theme. (Fonts are referenced here by family; the
 * actual Space Grotesk / Inter / JetBrains Mono files are bundled at P7.5 — until then
 * the fallbacks render.)
 */

:root {
	/* ---- spacing scale (4px base) ----
	 * The half-steps are not decoration: a sheet row packs a label, a number and two controls onto one
	 * line, and 4→8→12 is too coarse to space that — which is why hundreds of raw px literals grew
	 * between them. They are DERIVED from the values already in use, so adopting one moves nothing,
	 * and a theme can now reach the gaps it could not before. */
	--space-0: 0;
	--space-1: 0.25rem;
	--space-1-5: 0.375rem;
	--space-2: 0.5rem;
	--space-2-5: 0.625rem;
	--space-3: 0.75rem;
	--space-4: 1rem;
	--space-5: 1.5rem;
	--space-6: 2rem;
	--space-8: 3rem;

	/* ---- radius ---- */
	--radius-xs: 4px; /* a hairline rounding — a tag, a 2px-ish inset marker */
	--radius-sm: 6px;
	--radius: 8px; /* the default/base radius — by far the most common (buttons, inputs, chips, cards) */
	--radius-md: 11px;
	--radius-lg: 14px;
	--radius-full: 999px;

	/* ---- typography ---- */
	--font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
	--font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
	/* `--font-mono` labels/readouts looked jarring in Cyrillic (monospace Cyrillic reads badly), so
	 * the "mono" token now renders in the same sans family — one consistent typeface across locales.
	 * (True monospace can come back with a bundled Cyrillic-capable mono font at P7.5.) */
	--font-mono: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
	--font-size-micro: 0.625rem; /* 10px — tiny mono labels/eyebrows (9/10px unify here) */
	--font-size-xs: 0.6875rem; /* 11px (11/12px unify here) */
	--font-size-sm: 0.8125rem; /* 13px */
	--font-size-body: 0.875rem; /* 14px — body/control text (14/15px unify here) */
	--font-size-md: 1rem; /* 16px (16/17px unify here) */
	--font-size-lg: 1.25rem; /* 20px */
	--font-size-xl: 1.75rem; /* 28px */
	--font-size-2xl: 2.75rem;
	/* heading/display ramp — the sizes headers & big readouts actually use (ARCH-4: these
	 * did not map onto the t-shirt body scale, so a literal px was the only way to hit them;
	 * naming them as tokens lets the size-unit stylelint guard run and keeps themes overridable) */
	--font-size-h6: 1.125rem; /* 18px */
	--font-size-h5: 1.375rem; /* 22px */
	--font-size-h4: 1.5rem; /* 24px */
	--font-size-h3: 1.625rem; /* 26px */
	--font-size-h2: 1.875rem; /* 30px */
	--font-size-h1: 2.125rem; /* 34px */
	--line-height: 1.5;
	--tracking-label: 0.12em; /* mono uppercase labels/eyebrows */

	/* ---- elevation ---- */
	--shadow-1: 0 1px 2px rgb(0 0 0 / 0.4);
	--shadow-2: 0 8px 30px rgb(0 0 0 / 0.55);

	/* ---- focus ring (a11y: visible focus is non-negotiable) ---- */
	--focus-ring: 2px solid var(--color-accent);
	--focus-offset: 2px;

	/* ---- semantic colors: DARK (shipped default) ---- */
	color-scheme: dark;
	--color-bg: #0f1116;
	--color-surface: #171a21;
	--color-surface-2: #1f232c;
	--color-border: #272c37;
	--color-border-strong: #333a47;
	--color-text: #e6e8ec;
	--color-text-muted: #878f9d;
	--color-accent: #cf2b40; /* heraldic crimson */
	--color-accent-text: #ffffff;
	--color-accent-bright: #ef6b78; /* crimson AS TEXT on dark (labels, important) */
	--color-accent-deep: #b3243a; /* crimson bg behind white text (primary buttons) */
	--color-accent-soft: #241317; /* dark crimson tint (concentration/active-accent bg) */
	--color-resource: #caa24a; /* gold — spell slots / resource pips / prepared */
	--color-resource-soft: #2a2415;
	--color-good: #3bb8a6; /* teal — positive/confirmation, temp HP, available pips */
	--color-good-soft: #11302c;
	--color-good-line: #2c4a45; /* dark teal divider/border (slot pips) */
	--color-resource-line: #5a4d28; /* dark gold divider/border (recharge/resolution chips) */
	--color-warning-text: #1a1400; /* readable text ON the amber warning bg (count badges) */
	--color-success: #3fa66a;
	--color-warning: #e0a44b;
	--color-danger: #e0635a;
	--color-danger-soft: #2a1512; /* faint red tint bg (invalid-cell / danger banners) */
	--color-death: #000000; /* the ground a dead character's hit-point block stands on */
	--color-death-text: #ffffff;
	--color-glint: #ffffff; /* the light a moving surface catches: a spark, a shaft, a bright edge */
	--color-overlay: rgb(0 0 0 / 0.6);
}

[data-theme='light'] {
	color-scheme: light;
	--color-bg: #eef0ee;
	--color-surface: #ffffff;
	--color-surface-2: #f4f6f2;
	--color-border: #d9ddd6;
	--color-border-strong: #c3c9bd;
	--color-text: #1b2024;
	--color-text-muted: #5a6570;
	--color-accent: #b3243a;
	--color-accent-text: #ffffff;
	--color-accent-bright: #b3243a;
	--color-accent-deep: #b3243a;
	--color-accent-soft: #f6dde1;
	--color-resource: #9a6a1f;
	--color-resource-soft: #f1e7cf;
	--color-good: #1f8a7a;
	--color-good-soft: #d9efe9;
	--color-good-line: #a6d5cc;
	--color-resource-line: #cbb684;
	--color-warning-text: #ffffff;
	--color-success: #2e7d4f;
	--color-warning: #9a6a1f;
	--color-danger: #a32b22;
	--color-danger-soft: #f7dedb;
	--color-death: #000000;
	--color-death-text: #ffffff;
	--color-glint: #ffffff;
	--color-overlay: rgb(0 0 0 / 0.4);

	--shadow-1: 0 1px 2px rgb(0 0 0 / 0.08);
	--shadow-2: 0 10px 30px rgb(0 0 0 / 0.12);
}


</style>
