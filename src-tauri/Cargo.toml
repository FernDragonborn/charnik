[package]
name = "app"
version = "0.8.3"
description = "A D&D 5e (2014) + 5.5e (2024) character tracking system — build, play, and browse, over content you own as plain CSV."
authors = ["Fern Dragonborn <48766349+FernDragonborn@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/FernDragonborn/charnik"
edition = "2021"
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The table link's commands and their capability (`src/table_link.rs`). Off in a release: the app
# ships with no command of it for the page to call. CI compiles it on.
table-link = [
    "dep:iroh",
    "dep:tokio",
    "dep:data-encoding",
    "dep:getrandom",
    "dep:blake3",
    "dep:keyring-core",
    "dep:windows-native-keyring-store",
    "dep:dbus-secret-service-keyring-store",
    "dep:apple-native-keyring-store",
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# build.rs reads the UI's locale catalogs to compile the native consent dialog's words in.
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Escapes a granted folder's path before it is written into a scope pattern (lib.rs ▸
# `allow_dot_paths`); the same crate, at the same version, tauri matches scopes with.
glob = "0.3"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# `watch` is a CARGO FEATURE, not just a permission: the plugin registers its `watch`/`unwatch`
# commands behind it, so without this the capability's `fs:allow-watch` grants access to a command
# that was never compiled in — and `startContentWatcher` fails as an unhandled rejection nobody sees.
# That is the whole of "CSV edits on disk are picked up in real time" (CLAUDE.md), so it must stay on.
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Content-pack updates fetch over HTTPS from Rust, never webview `fetch` (docs/SECURITY.md §5).
# Depended on for its HTTP client alone (`remote.rs`): the plugin is NOT initialised, so its `fetch`
# command — any method, any header, to whatever the scope allows — does not exist for the page.
tauri-plugin-http = "2"
# The table link's transport (`table_link/`), compiled only with the `table-link` feature. The
# defaults are left out on purpose: `portmapper` asks the router to open a port (UPnP/PCP/NAT-PMP),
# `fast-apple-datapath` uses private Apple APIs, and `metrics` collects what nothing reads.
iroh = { version = "1.4", default-features = false, features = ["tls-ring"], optional = true }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"], optional = true }
# An invitation is bytes a person pastes (`table_link/wire.rs`), and its secret is the OS's randomness.
data-encoding = { version = "2", optional = true }
getrandom = { version = "0.4", optional = true }
# What a stranger's key must show against the open door before it takes a greeting place
# (`table_link/wire.rs` ▸ `knocks`). The hash iroh already builds on.
blake3 = { version = "1.8", optional = true }
# A remembered table's key lives in the OS's own credential store, never a file
# (`table_link/remember.rs`).
keyring-core = { version = "1.0.1", optional = true }

[dev-dependencies]
# `remote.rs` builds a response by hand to test its size ceiling without a network.
http = "1"
tokio = { version = "1", features = ["macros", "rt"] }

# Desktop-only: self-update from signed GitHub-release artifacts (`self_update.rs`).
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
# One process per data folder: a second launch focuses the open window instead of becoming a second
# writer of the same `character.json`.
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
windows-native-keyring-store = { version = "1.1.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"], optional = true }
