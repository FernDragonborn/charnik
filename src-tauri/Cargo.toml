[package]
name = "app"
version = "0.6.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# `watch` is a CARGO FEATURE, not just a permission: the plugin registers its `watch`/`unwatch`
# commands behind it, so without this the capability's `fs:allow-watch` grants access to a command
# that was never compiled in — and `startContentWatcher` fails as an unhandled rejection nobody sees.
# That is the whole of "CSV edits on disk are picked up in real time" (CLAUDE.md), so it must stay on.
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Content-pack updates fetch over HTTPS from Rust, never webview `fetch` (docs/SECURITY.md §5).
tauri-plugin-http = "2"

# Desktop-only: self-update from signed GitHub-release artifacts + relaunch after install.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
