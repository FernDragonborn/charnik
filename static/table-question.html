<!doctype html>
<!--
  The window a table's question is asked in: open a table, join one, let a player in, return to
  one. Rust opens it, words it, and believes an answer only from it (src-tauri/src/table_link/
  question.rs); the app's page cannot reach into it. It does not follow the user's theme on
  purpose: a theme is the page's to set, and the page must not be able to restyle the question.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Charnik</title>
		<style>
			:root {
				--color-bg: #0f1116;
				--color-surface: #171a21;
				--color-border: #272c37;
				--color-border-strong: #333a47;
				--color-text: #e6e8ec;
				--color-text-muted: #878f9d;
				--color-accent: #cf2b40;
				--color-accent-text: #ffffff;
				--color-accent-deep: #b3243a;
				--font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
				--font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				color-scheme: dark;
			}
			@media (prefers-color-scheme: light) {
				:root {
					--color-bg: #eef0ee;
					--color-surface: #ffffff;
					--color-border: #d9ddd6;
					--color-border-strong: #c3c9bd;
					--color-text: #1b2024;
					--color-text-muted: #5a6570;
					--color-accent: #b3243a;
					color-scheme: light;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				flex-direction: column;
				background: var(--color-bg);
				color: var(--color-text);
				font: 14px/1.5 var(--font-body);
				user-select: none;
			}
			main {
				flex: 1;
				display: flex;
				flex-direction: column;
				gap: 12px;
				margin: 12px;
				padding: 20px 22px 16px;
				background: var(--color-surface);
				border: 1px solid var(--color-border-strong);
				border-left: 3px solid var(--color-accent);
				border-radius: 10px;
			}
			h1 {
				margin: 0;
				font: 600 20px/1.25 var(--font-display);
			}
			p {
				margin: 0;
				white-space: pre-line;
				overflow-wrap: anywhere;
			}
			footer {
				display: flex;
				justify-content: flex-end;
				gap: 8px;
				margin-top: auto;
				padding-top: 8px;
			}
			button {
				min-width: 96px;
				padding: 8px 16px;
				border-radius: 6px;
				border: 1px solid var(--color-border-strong);
				background: transparent;
				color: var(--color-text);
				font: 600 14px var(--font-body);
				cursor: pointer;
			}
			button.allow {
				background: var(--color-accent-deep);
				border-color: var(--color-accent-deep);
				color: var(--color-accent-text);
			}
			button:focus-visible {
				outline: 2px solid var(--color-accent);
				outline-offset: 2px;
			}
			button:disabled {
				opacity: 0.5;
				cursor: default;
			}
		</style>
		<script src="table-question.js" defer></script>
	</head>
	<body>
		<main aria-labelledby="question-title" aria-describedby="question-body">
			<h1 id="question-title"></h1>
			<p id="question-body"></p>
			<footer>
				<button type="button" class="deny" id="question-deny" disabled></button>
				<button type="button" class="allow" id="question-allow" disabled></button>
			</footer>
		</main>
	</body>
</html>
