name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: CI only checks/tests/builds — it never writes to the repo or creates releases.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # the SRD content is its own repo (docs/PLAN.md REL-4 slice 0) — tests and the build both read
    # it. Locally it's the sibling folder; here it can't be (actions/checkout refuses a path outside
    # the workspace), so check it out inside and point the resolver at it.
    env:
      CHARNIK_CONTENT: .content-srd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: FernDragonborn/charnik-content-srd
          path: .content-srd

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # component tests run in headless Chromium (vitest browser mode)
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build (SPA)
        run: pnpm build
