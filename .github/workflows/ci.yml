name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: CI only checks/tests/builds — it never writes to the repo or creates releases.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # the SRD content is its own repo (docs/plan.md REL-4 slice 0) — tests and the build both read
    # it. Locally it's the sibling folder; here it can't be (actions/checkout refuses a path outside
    # the workspace), so check it out inside and point the resolver at it.
    env:
      CHARNIK_CONTENT: .content-srd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: FernDragonborn/charnik-content-srd
          path: .content-srd

      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # component tests run in headless Chromium (vitest browser mode)
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The TYPE gate. It ran only in the local pre-push hook until 2026-08-21, so a `--no-verify`
      # push (or a clone whose hooks were never installed) could land type errors with CI still green.
      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # The type-aware rules (floating promises, "[object Object]", dead casts). CI-only: they make
      # ESLint build the whole TS program first, ~8 min measured against 26s for the syntax pass —
      # machine time here, but it would be a wall in front of every push.
      - name: Lint (type-aware)
        run: pnpm lint:typed

      - name: Build (SPA)
        run: pnpm build

  # The table link's Rust is behind a Cargo feature that is OFF in a release, so nothing but this
  # compiles it: the commands, and the capability file that is read only with the feature on.
  table-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # what Tauri links against on Linux, as release.yml installs it
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             libxdo-dev             libssl-dev             build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check (table-link)
        working-directory: src-tauri
        run: cargo check --features table-link
